services:
  - type: web
    name: soltol-frontend-staging
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://bettano-erp-backend-staging.onrender.com
      - key: VITE_API_BASE_URL
        value: https://bettano-erp-backend-staging.onrender.com/api
      - key: VITE_APP_ENV
        value: staging
      - key: VITE_APP_URL
        value: https://app.soltol.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /*
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /*
        name: Pragma
        value: no-cache
      - path: /*
        name: Expires
        value: "0"
