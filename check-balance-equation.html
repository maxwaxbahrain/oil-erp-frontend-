<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balance Sheet Equation Checker</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #C74634;
            text-align: center;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .equation {
            background: #f8f9fa;
            border: 3px solid #C74634;
            border-radius: 8px;
            padding: 30px;
            margin: 30px 0;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }

        .equation.balanced {
            background: #d4edda;
            border-color: #28a745;
            color: #155724;
        }

        .equation.unbalanced {
            background: #f8d7da;
            border-color: #dc3545;
            color: #721c24;
        }

        .values {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 20px 0;
        }

        .value-box {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #C74634;
        }

        .value-box h3 {
            margin: 0 0 10px 0;
            color: #C74634;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .value-box .amount {
            font-size: 32px;
            font-weight: bold;
            color: #333;
            font-family: 'Courier New', monospace;
        }

        .breakdown {
            margin-top: 10px;
            font-size: 12px;
            color: #666;
        }

        button {
            background: #C74634;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin: 10px 0;
        }

        button:hover {
            background: #A63829;
        }

        .status {
            text-align: center;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            font-size: 18px;
            font-weight: bold;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 2px solid #28a745;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #dc3545;
        }

        .checkmark {
            font-size: 48px;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>⚖️ Balance Sheet Equation Checker</h1>
        <p class="subtitle">Verify that your Balance Sheet follows the fundamental accounting equation</p>

        <button onclick="checkBalance()">🔍 Check Balance Sheet Equation</button>

        <div id="results"></div>
    </div>

    <script>
        function formatCurrency(value) {
            if (value >= 1000000) {
                return '$' + (value / 1000000).toFixed(2) + 'M';
            } else if (value >= 1000) {
                return '$' + (value / 1000).toFixed(0) + 'k';
            }
            return '$' + value.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        async function checkBalance() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<p style="text-align: center; color: #666;">Calculating...</p>';

            try {
                // Get all data
                const invoices = JSON.parse(localStorage.getItem('zavi_invoices') || '[]');
                const purchaseOrders = JSON.parse(localStorage.getItem('zavi_purchase_orders') || '[]');
                const expenses = JSON.parse(localStorage.getItem('zavi_expenses') || '[]');
                const products = JSON.parse(localStorage.getItem('zavi_products') || '[]');
                const financialSettings = JSON.parse(localStorage.getItem('zavi_financial_settings') || '{"ownersCapital": 150000, "shortTermDebt": 0, "longTermDebt": 0}');

                // Calculate Assets
                const unpaidInvoices = invoices.filter(inv => inv.payment_status === 'Unpaid');
                const accountsReceivable = unpaidInvoices.reduce((sum, inv) => sum + inv.grandTotal, 0);

                let inventory = 0;
                products.forEach(p => {
                    const stock = p.locations?.reduce((s, loc) => s + loc.currentStock, 0) || 0;
                    const cost = p.pricing?.landedCost || p.pricing?.sellingPrice || 0;
                    inventory += stock * cost;
                });

                // Simplified cash calculation (you can enhance this)
                const cash = 200000; // This would come from cash flow service

                const equipmentExpenses = expenses.filter(exp =>
                    exp.category?.toLowerCase().includes('equipment') ||
                    exp.category?.toLowerCase().includes('asset') ||
                    exp.category?.toLowerCase().includes('property')
                );
                const equipmentPurchases = equipmentExpenses.reduce((sum, exp) => sum + exp.amount, 0);
                const accumulatedDepreciation = equipmentPurchases * 0.2; // Simplified
                const netFixedAssets = Math.max(0, equipmentPurchases - accumulatedDepreciation);

                const totalAssets = cash + accountsReceivable + inventory + netFixedAssets;

                // Calculate Liabilities
                const unpaidPOs = purchaseOrders.filter(po => po.payment_status === 'Unpaid');
                const accountsPayable = unpaidPOs.reduce((sum, po) => sum + po.grandTotal, 0);
                const shortTermDebt = financialSettings.shortTermDebt || 0;
                const longTermDebt = financialSettings.longTermDebt || 0;
                const totalLiabilities = accountsPayable + shortTermDebt + longTermDebt;

                // Calculate Equity
                const ownersCapital = financialSettings.ownersCapital || 150000;
                const retainedEarnings = totalAssets - totalLiabilities - ownersCapital;
                const totalEquity = ownersCapital + retainedEarnings;

                // Check if balanced
                const leftSide = totalAssets;
                const rightSide = totalLiabilities + totalEquity;
                const difference = Math.abs(leftSide - rightSide);
                const isBalanced = difference < 0.01; // Allow for rounding errors

                // Display results
                let html = '';

                html += '<div class="values">';
                html += '<div class="value-box">';
                html += '<h3>📊 Total Assets</h3>';
                html += '<div class="amount">' + formatCurrency(totalAssets) + '</div>';
                html += '<div class="breakdown">';
                html += 'Cash: ' + formatCurrency(cash) + '<br>';
                html += 'A/R: ' + formatCurrency(accountsReceivable) + '<br>';
                html += 'Inventory: ' + formatCurrency(inventory) + '<br>';
                html += 'Fixed Assets: ' + formatCurrency(netFixedAssets);
                html += '</div>';
                html += '</div>';

                html += '<div class="value-box">';
                html += '<h3>💰 Liabilities + Equity</h3>';
                html += '<div class="amount">' + formatCurrency(rightSide) + '</div>';
                html += '<div class="breakdown">';
                html += 'Liabilities: ' + formatCurrency(totalLiabilities) + '<br>';
                html += '  - A/P: ' + formatCurrency(accountsPayable) + '<br>';
                html += 'Equity: ' + formatCurrency(totalEquity) + '<br>';
                html += '  - Capital: ' + formatCurrency(ownersCapital) + '<br>';
                html += '  - Retained: ' + formatCurrency(retainedEarnings);
                html += '</div>';
                html += '</div>';
                html += '</div>';

                html += '<div class="equation ' + (isBalanced ? 'balanced' : 'unbalanced') + '">';
                html += formatCurrency(leftSide) + ' = ' + formatCurrency(rightSide);
                if (!isBalanced) {
                    html += '<br><small>Difference: ' + formatCurrency(difference) + '</small>';
                }
                html += '</div>';

                if (isBalanced) {
                    html += '<div class="status success">';
                    html += '<div class="checkmark">✅</div>';
                    html += 'BALANCE SHEET IS BALANCED!<br>';
                    html += '<small>Assets = Liabilities + Equity</small>';
                    html += '</div>';
                } else {
                    html += '<div class="status error">';
                    html += '<div class="checkmark">❌</div>';
                    html += 'BALANCE SHEET IS NOT BALANCED!<br>';
                    html += '<small>There is a difference of ' + formatCurrency(difference) + '</small>';
                    html += '</div>';
                }

                // Show detailed breakdown
                html += '<details style="margin-top: 20px;">';
                html += '<summary style="cursor: pointer; font-weight: bold; padding: 10px; background: #f8f9fa; border-radius: 4px;">📋 Detailed Breakdown</summary>';
                html += '<div style="padding: 15px; background: #f8f9fa; margin-top: 10px; border-radius: 4px;">';
                html += '<h4>Assets:</h4>';
                html += '<ul>';
                html += '<li>Cash: ' + formatCurrency(cash) + '</li>';
                html += '<li>Accounts Receivable: ' + formatCurrency(accountsReceivable) + ' (' + unpaidInvoices.length + ' unpaid invoices)</li>';
                html += '<li>Inventory: ' + formatCurrency(inventory) + '</li>';
                html += '<li>Fixed Assets (net): ' + formatCurrency(netFixedAssets) + '</li>';
                html += '<li><strong>Total Assets: ' + formatCurrency(totalAssets) + '</strong></li>';
                html += '</ul>';
                html += '<h4>Liabilities:</h4>';
                html += '<ul>';
                html += '<li>Accounts Payable: ' + formatCurrency(accountsPayable) + ' (' + unpaidPOs.length + ' unpaid POs)</li>';
                html += '<li>Short-term Debt: ' + formatCurrency(shortTermDebt) + '</li>';
                html += '<li>Long-term Debt: ' + formatCurrency(longTermDebt) + '</li>';
                html += '<li><strong>Total Liabilities: ' + formatCurrency(totalLiabilities) + '</strong></li>';
                html += '</ul>';
                html += '<h4>Equity:</h4>';
                html += '<ul>';
                html += '<li>Owner\'s Capital: ' + formatCurrency(ownersCapital) + '</li>';
                html += '<li>Retained Earnings: ' + formatCurrency(retainedEarnings) + ' (calculated to balance)</li>';
                html += '<li><strong>Total Equity: ' + formatCurrency(totalEquity) + '</strong></li>';
                html += '</ul>';
                html += '</div>';
                html += '</details>';

                resultsDiv.innerHTML = html;

            } catch (error) {
                resultsDiv.innerHTML = '<div class="status error">Error: ' + error.message + '</div>';
            }
        }

        // Auto-run on load
        window.addEventListener('load', () => {
            setTimeout(checkBalance, 500);
        });
    </script>
</body>

</html>
