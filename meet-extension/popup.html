<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: sans-serif; width: 300px; padding: 15px; }
    button { width: 100%; padding: 10px; margin-top: 10px; font-weight: bold; cursor: pointer; border-radius: 8px; border: none; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #start { background: #9333ea; color: white; }
    #start:hover:not(:disabled) { background: #7e22ce; }
    #stop { background: #ef4444; color: white; display: none; }
    #stop:hover { background: #dc2626; }
    #login { background: #111827; color: white; }
    #login:hover { background: #374151; }
    #logout { background: transparent; color: #9333ea; border: 1px solid #9333ea; font-size: 12px; padding: 6px; margin-top: 6px; }
    #logout:hover { background: #f3e8ff; }
    #status { margin-top: 15px; font-size: 12px; color: #666; }
    #auth-status { font-size: 12px; color: #374151; margin: 0 0 8px 0; }
    #login-error { font-size: 11px; color: #dc2626; margin-top: 6px; min-height: 14px; }
    .auth-field { width: 100%; box-sizing: border-box; padding: 8px; margin-top: 6px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; }
    .auth-divider { border: none; border-top: 1px solid #e5e7eb; margin: 14px 0; }
  </style>
</head>
<body>
  <h3 style="margin-top:0; color: #111827;">Soltol Meeting Notes</h3>

  <div id="auth-section">
    <p id="auth-status">Not logged in</p>
    <div id="login-fields">
      <input id="username" class="auth-field" type="text" placeholder="Username" autocomplete="username">
      <input id="password" class="auth-field" type="password" placeholder="Password" autocomplete="current-password">
      <button id="login" type="button">Log in</button>
      <div id="login-error"></div>
    </div>
    <button id="logout" type="button" style="display: none;">Log out</button>
  </div>

  <hr class="auth-divider">

  <p style="font-size: 12px; color: #666;">Start this in an active Google Meet tab. For best results, turn on Meet Captions.</p>
  <button id="start" disabled>Start Capturing</button>
  <button id="stop">Stop & Analyze</button>
  <div id="status">Status: Idle</div>
  <script src="popup.js"></script>
</body>
</html>
